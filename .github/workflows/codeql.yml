name: CodeQL Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated languages to scan (go,javascript-typescript,python)'
        required: false
        type: string
        default: 'go'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.languages) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/testdata/**'
              - '**/*_test.go'
              - 'deployments/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: true

      - name: Upload SARIF results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: ignore
          retention-days: 30

  prepare:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.languages.outputs.value }}
    steps:
      - name: Validate requested languages
        id: languages
        uses: actions/github-script@v7
        with:
          script: |
            const supported = new Set(['go', 'javascript-typescript', 'python']);
            const requested = (context.payload.inputs?.languages || 'go')
              .split(',').map(language => language.trim()).filter(Boolean);
            const invalid = requested.filter(language => !supported.has(language));
            if (requested.length === 0 || invalid.length > 0) {
              throw new Error(`Unsupported CodeQL language(s): ${invalid.join(', ') || '(empty)'}`);
            }
            core.setOutput('value', JSON.stringify([...new Set(requested)]));
