name: Dependency Review

on:
  pull_request:
    branches: ["main"]
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: 'Pull request number to review'
        required: true
        type: number
      fail-on-severity:
        description: 'Fail PR when vulnerability severity >= (low/medium/high/critical)'
        required: false
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: 'high'
      enable-govulncheck:
        description: 'Run Go govulncheck caller-level scan'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Check Dependency Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve comparison refs for manual run
        id: refs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = Number(context.payload.inputs['pull-request-number']);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              throw new Error('A valid pull-request-number is required.');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            osv.dev:443
            api.osv.dev:443

      - name: Dependency Review (GitHub Advisory Database)
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || false }}
          fail-on-severity: ${{ github.event.inputs.fail-on-severity || 'high' }}
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unlicense, CC0-1.0
          warn-on-openssf-scorecard-level: 3
          base-ref: ${{ github.event.pull_request.base.sha || steps.refs.outputs.base }}
          head-ref: ${{ github.event.pull_request.head.sha || steps.refs.outputs.head }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Go Vulnerability Check (govulncheck)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.enable-govulncheck == 'true'
        run: |
          echo "::group::Installing govulncheck"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "::endgroup::"

          echo "::group::Running govulncheck"
          govulncheck -v ./... || (
            echo "::warning::govulncheck reported issues. Review the output above."
            exit 1
          )
          echo "::endgroup::"

      - name: Go Modules Check
        run: |
          echo "::group::Verifying go.mod / go.sum consistency"
          go mod verify
          echo "::endgroup::"

          echo "::group::Checking for module replace directives"
          if grep -qE '^\s*replace\s+' go.mod; then
            echo "::notice title=Module replace directives found::go.mod contains replace directives. Ensure these are intentional and temporary."
            grep -nE '^\s*replace\s+' go.mod
          else
            echo "No replace directives found. Good."
          fi
          echo "::endgroup::"

          echo "::group::Checking for deprecated modules"
          go list -u -m -json all 2>/dev/null | python3 -c "
          import json, sys, subprocess
          deprecated = []
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              try:
                  mod = json.loads(line)
                  if mod.get('Deprecated'):
                      deprecated.append((mod['Path'], mod.get('Version',''), mod['Deprecated']))
              except:
                  pass
          if deprecated:
              print('::warning::Deprecated modules found:')
              for p, v, why in deprecated:
                  print(f'  {p}@{v}: {why}')
          else:
              print('No deprecated modules detected.')
          "
          echo "::endgroup::"
