name: Trivy CVE & Misconfiguration Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to fail (LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      exit-code:
        description: 'Exit non-zero when vulnerabilities of severity are found (blocks PR)'
        required: false
        type: string
        default: '1'
      scan-images:
        description: 'Build & scan Docker images additionally (takes longer)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fs:
    name: Filesystem + Go Modules Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Go mod download (improves Go binary / module scan)
        run: go mod download

      - name: Trivy Filesystem Scan (libraries)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'library,os'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          format: 'sarif'
          output: 'trivy-fs.sarif'
          exit-code: '0'

      - name: Upload FS SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'

  docker:
    name: Dockerfile + Infrastructure as Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy Misconfiguration (IaC/Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          severity: 'MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true
          scanners: 'misconfig,secret,vuln'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-config.txt'
          exit-code: '0'
      - name: Upload config results as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-config
          path: trivy-config.txt
          retention-days: 14

      - name: Build API image
        if: github.event.inputs.scan-images == 'true'
        run: docker build -t open-ads-api:ci -f cmd/api/Dockerfile .

      - name: Scan API image
        if: github.event.inputs.scan-images == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'open-ads-api:ci'
          ignore-unfixed: true
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          exit-code: ${{ github.event.inputs.exit-code || '1' }}

      - name: Upload image SARIF to Security tab
        if: always() && github.event.inputs.scan-images == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'
