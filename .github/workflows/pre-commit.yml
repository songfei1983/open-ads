name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version for pre-commit framework'
        required: false
        type: string
      golangci-version:
        description: 'Override golangci-lint version'
        required: false
        type: string

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ github.event.inputs.python-version || '3.13' }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
        cache: true # Built-in caching for Go modules

    # Faster: Official action uses pre-compiled binaries and has built-in caching
    - name: Golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ github.event.inputs.golangci-version || 'latest' }}

    # goimports is still needed if your pre-commit hook calls it specifically
    - name: Install tools
      run: go install golang.org/x/tools/cmd/goimports@latest

    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
