name: Go

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        service: [ssp, dsp, dmp]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ssp/go.mod
      - name: Start infrastructure
        run: docker compose -f deployments/docker-compose.yml up -d --wait
      - name: Validate migrations and isolation
        run: make migration-check
      - name: Verify MariaDB schemas
        run: |
          test "$(docker compose -f deployments/docker-compose.yml exec -T mariadb mariadb -uroot -proot_password -Nse 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = "ssp_db";')" -gt 0
          test "$(docker compose -f deployments/docker-compose.yml exec -T mariadb mariadb -uroot -proot_password -Nse 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = "dsp_db";')" -gt 0
      - name: Verify ClickHouse schema
        run: test "$(docker compose -f deployments/docker-compose.yml exec -T clickhouse clickhouse-client --query 'SHOW TABLES FROM dmp' | wc -l)" -eq 6
      - name: Start SSP and DSP for RTB smoke test
        run: |
          (cd dsp && nohup go run ./cmd/dsp > "$RUNNER_TEMP/dsp.log" 2>&1 & echo $! > "$RUNNER_TEMP/dsp.pid")
          (cd ssp && DSP_URL=http://127.0.0.1:8081 nohup go run ./cmd/ssp > "$RUNNER_TEMP/ssp.log" 2>&1 & echo $! > "$RUNNER_TEMP/ssp.pid")
          for service in ssp dsp; do
            port=8080
            test "$service" = dsp && port=8081
            for attempt in $(seq 1 30); do
              curl --fail --silent "http://127.0.0.1:${port}/readyz" && break
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:${port}/readyz"
          done
      - name: Verify SSP to DSP OpenRTB no-bid smoke
        run: |
          response="$(curl --fail --silent --X POST http://127.0.0.1:8080/openrtb2/auction \
            -H 'Content-Type: application/json' \
            --data-binary @fixtures/openrtb2/bid_request_banner.json)"
          echo "$response"
          echo "$response" | grep -q '"id"'
          echo "$response" | grep -q '"nbr":2'
      - name: Stop infrastructure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ssp.pid" ]; then kill "$(cat "$RUNNER_TEMP/ssp.pid")" || true; fi
          if [ -f "$RUNNER_TEMP/dsp.pid" ]; then kill "$(cat "$RUNNER_TEMP/dsp.pid")" || true; fi
          docker compose -f deployments/docker-compose.yml down -v
