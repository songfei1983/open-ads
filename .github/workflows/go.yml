# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      go-version:
        description: 'Go version to use (override default)'
        required: false
        type: string
      run-race:
        description: 'Run tests with -race detector'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        disable-sudo: true
        egress-policy: audit
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          proxy.golang.org:443
          sum.golang.org:443
          objects.githubusercontent.com:443
          *.actions.githubusercontent.com:443

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ github.event.inputs.go-version || '1.26' }}
        cache: true

    - name: Check go.mod / go.sum consistency
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "::error::go.mod/go.sum is out of sync. Please run go mod tidy and commit changes." && exit 1)

    - name: Build api
      run: go build -trimpath -ldflags="-s -w" -v ./cmd/api

    - name: Build ad
      run: go build -trimpath -ldflags="-s -w" -v ./cmd/ad

    - name: Build dataflow
      run: go build -trimpath -ldflags="-s -w" -v ./cmd/dataflow

    - name: Test
      if: github.event.inputs.run-race != 'false'
      run: go test -race -count=1 -v ./...

    - name: Test without race detector
      if: github.event.inputs.run-race == 'false'
      run: go test -count=1 -v ./...
