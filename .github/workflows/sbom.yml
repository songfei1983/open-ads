name: SBOM Generation & Dependency Snapshot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      format:
        description: 'SBOM output format(s): cyclonedx-json,spdx-json,syft-json'
        required: false
        type: string
        default: 'cyclonedx-json,spdx-json'
      upload-snapshot:
        description: 'Upload SBOM snapshot to GitHub Dependency graph'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - root-gomod
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.target == 'root-gomod'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Resolve Go modules (download before syft scan)
        if: matrix.target == 'root-gomod'
        run: go mod download

      - name: Generate SBOM with Syft
        id: syft
        uses: anchore/sbom-action@v0
        with:
          format: ${{ github.event.inputs.format || 'cyclonedx-json,spdx-json' }}
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-${{ matrix.target }}
          dependency-snapshot: ${{ github.event_name != 'pull_request' && (github.event.inputs.upload-snapshot != 'false') }}
          path: './'

      - name: Summarize SBOM to run summary
        shell: bash
        run: |
          set -e
          echo "### SBOM Summary (${{ matrix.target }})" >> $GITHUB_STEP_SUMMARY
          echo "- Formats: ${{ github.event.inputs.format || 'cyclonedx-json,spdx-json' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency snapshot uploaded: ${{ github.event_name != 'pull_request' && github.event.inputs.upload-snapshot != 'false' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f sbom-${{ matrix.target }}.cyclonedx.json ]; then
            PKG_COUNT=$(python3 -c "import json;d=json.load(open('sbom-${{ matrix.target }}.cyclonedx.json'));print(len(d.get('components',[])))")
            echo "- CycloneDX package count: **$PKG_COUNT**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SBOM artifacts are uploaded to this run (Actions tab) for offline audit." >> $GITHUB_STEP_SUMMARY

  image-scan:
    name: Scan Images for CVEs (Trivy SBOM Mode)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sbom-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          vuln-type: 'library'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-sbom-fs.sarif'
          category: 'trivy-fs-sbom'
