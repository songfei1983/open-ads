services:
  mariadb:
    image: mariadb:10.6
    container_name: open-ads-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ssp_db
      MYSQL_USER: ads_admin
      MYSQL_PASSWORD: ads_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
      - ../ssp/migrations:/migrations/ssp:ro
      - ../dsp/migrations:/migrations/dsp:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: open-ads-valkey
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./valkey/users.acl:/etc/valkey/users.acl:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "--user", "ssp", "--pass", "ssp_valkey_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: open-ads-clickhouse
    environment:
      CLICKHOUSE_DB: dmp
      CLICKHOUSE_USER: dmp_user
      CLICKHOUSE_PASSWORD: dmp_clickhouse_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../dmp/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DSP service – built from the local Dockerfile.
  dsp:
    build:
      context: ../dsp
      dockerfile: Dockerfile
      # dev target runs air for hot reload; drop it for production-style builds.
      target: dev
    image: open-ads-dsp:dev
    container_name: open-ads-dsp
    depends_on:
      - mariadb
      - valkey
    environment:
      DSP_PORT: "8081"
      DSP_DB_HOST: "mariadb"
      DSP_DB_PORT: "3306"
      DSP_DB_USER: "dsp_user"
      DSP_DB_PASSWORD: "dsp_pass"
      DSP_DB_NAME: "dsp_db"
      DSP_VALKEY_ADDR: "valkey:6379"
      # Creative serving whitelist: landing host=MIME pairs.
      DSP_CREATIVE_WHITELIST: "example.com=image/png"
      DSP_LEASE_TOKEN_KEY: "0f5e1b20a3c94d57b8e6f2a1d7c35e9b4a8d6c2e7f1b9d3a5c8e0f2b4d6a8c1e"
      # Enable the admin management API and a publishing endpoint.
      DSP_ADMIN_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      DSP_ADMIN_TOKEN: "supersecrettoken1234567890abcdEF"
      DSP_CONFIG_PUBLISHER: "true"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../dsp:/src
      - ../dsp/.air.toml:/src/.air.toml
      # Uploaded creatives must survive container recreation.
      - dsp_assets:/var/openads
    command: ["-c", ".air.toml"]

  # Console service – the standalone sandbox operations UI.
  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    image: open-ads-console:dev
    container_name: open-ads-console
    environment:
      # Console proxies the browser to the DSP management API and injects
      # the admin bearer token server side; the UI holds no credentials.
      DSP_ADMIN_URL: "http://dsp:8081"
      DSP_ADMIN_TOKEN: "supersecrettoken1234567890abcdEF"
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      # Mounted read-only so UI edits show up in the browser without a
      # rebuild; the injected revision watcher picks them up in ~1.5s.
      - ../console/web:/app/web:ro

  # SSP service – built from the local Dockerfile.
  ssp:
    build:
      context: ../ssp
      dockerfile: Dockerfile
      # dev target runs air for hot reload; drop it for production-style builds.
      target: dev
    image: open-ads-ssp:dev
    container_name: open-ads-ssp
    depends_on:
      - mariadb
      - valkey
      - dsp
      - dmp
    environment:
      # Use defaults from config loader; override if needed.
      SSP_PORT: "8080"
      # Route client auctions to the DSP bidder and consent checks to the DMP.
      DSP_URL: "http://dsp:8081"
      DMP_URL: "http://dmp:8082"
      VALKEY_ADDR: "valkey:6379"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../ssp:/src
      - ../ssp/.air.toml:/src/.air.toml
    command: ["-c", ".air.toml"]

  # DMP service – built from the local Dockerfile.
  dmp:
    build:
      context: ../dmp
      dockerfile: Dockerfile
      # dev target runs air for hot reload; drop it for production-style builds.
      target: dev
    image: open-ads-dmp:dev
    container_name: open-ads-dmp
    depends_on:
      - clickhouse
    environment:
      DMP_PORT: "8082"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_USER: "dmp_user"
      CLICKHOUSE_PASSWORD: "dmp_clickhouse_password"
      CLICKHOUSE_DATABASE: "dmp"
      # The management API is tenant scoped: the token is bound to exactly one
      # tenant, so a browser or operator credential can never cross tenants.
      DMP_ADMIN_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      DMP_ADMIN_TOKEN: "dmp-admin-token-0123456789abcdef"
      DMP_ADMIN_ACTOR: "sandbox-dmp-operator"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ../dmp:/src
      - ../dmp/.air.toml:/src/.air.toml
    command: ["-c", ".air.toml"]

volumes:
  mariadb_data:
  clickhouse_data:
  dsp_assets:
