services:
  mariadb:
    image: mariadb:10.6
    container_name: open-ads-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ssp_db
      MYSQL_USER: ads_admin
      MYSQL_PASSWORD: ads_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
      - ../ssp/migrations:/migrations/ssp:ro
      - ../dsp/migrations:/migrations/dsp:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: open-ads-valkey
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./valkey/users.acl:/etc/valkey/users.acl:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "--user", "ssp", "--pass", "ssp_valkey_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: open-ads-clickhouse
    environment:
      CLICKHOUSE_DB: dmp
      CLICKHOUSE_USER: dmp_user
      CLICKHOUSE_PASSWORD: dmp_clickhouse_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../dmp/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mariadb_data:
  clickhouse_data:
