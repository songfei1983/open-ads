# Air live-reload for the ssp service (go module subdir: ./cmd/ssp)
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/ssp-bin ./cmd/ssp"
bin = "tmp/ssp-bin"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "node_modules", "migrations", "docs"]
exclude_unchanged = true
delay = 500
stop_on_error = true

[log]
time = true
